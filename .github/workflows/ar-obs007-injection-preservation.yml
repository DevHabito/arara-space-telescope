name: AR-OBS007 injected dip recovery benchmark

on:
  push:
    branches:
      - research/ar-obs007-incremental-telemetry-20261121
  pull_request:
    paths:
      - 'docs/preregistration/AR-OBS007-P02.md'
      - 'scripts/ar_obs007_injection_preservation.py'
      - 'tests/test_ar_obs007_injection_preservation.py'
      - '.github/workflows/ar-obs007-injection-preservation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  injection-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scientific dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "astropy>=6,<8"
      - name: Validate injection, PLD fractions and regression without outside data
        run: python -m unittest discover -s tests -p 'test_ar_obs007_injection_preservation.py' -v
      - name: Evaluate frozen PLD and quaternion comparisons on TESS
        run: python -m scripts.ar_obs007_injection_preservation ar_obs007_p02.json
      - name: Preserve result or access-failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-obs007-p02-injection-preservation
          path: ar_obs007_p02.json
          retention-days: 30
          if-no-files-found: warn
