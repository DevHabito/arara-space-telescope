name: AR-OBS001 TESS source audit

on:
  push:
    branches:
      - research/ar-obs001-tess-access-audit-20261120
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audited FITS reader dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "astropy>=6,<8"
      - name: Validate audit logic without network
        run: python -m unittest discover -s tests -p 'test_ar_obs001_tess_audit.py' -v
      - name: Audit selected public TESS product (no event search)
        run: python scripts/ar_obs001_tess_audit.py ar_obs001_audit.json
      - name: Archive compact provenance report even on access error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-obs001-tess-provenance
          path: ar_obs001_audit.json
          if-no-files-found: warn
          retention-days: 30
