name: m38br-independent-projection
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Projection differential and adverse regressions
        run: python -m unittest discover -s tests -p 'test_m38br_independent_projection.py' -v
      - name: Unlabeled CPU and memory microbenchmark
        run: python scripts/m38br_projection_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: m38br-projection-microbenchmark
          path: m38br_projection_benchmark.json
          if-no-files-found: error
          retention-days: 30
