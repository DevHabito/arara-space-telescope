name: m38br-counterfactual
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-candidate-counterfactual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Fixed-observation true-onset counterfactual
        run: python scripts/m38br_counterfactual.py
