name: AR-OBS007 incremental information benchmark

on:
  push:
    branches:
      - research/ar-obs007-incremental-telemetry-20261121
  pull_request:
    paths:
      - 'docs/preregistration/AR-OBS007-P01.md'
      - 'scripts/ar_obs007_incremental_telemetry.py'
      - 'tests/test_ar_obs007_incremental_telemetry.py'
      - '.github/workflows/ar-obs007-incremental-telemetry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install previously selected scientific dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "astropy>=6,<8"
      - name: Run synthetic no-network regression checks
        run: python -m unittest discover -s tests -p 'test_ar_obs007_incremental_telemetry.py' -v
      - name: Execute preregistered public TESS comparison
        run: python -m scripts.ar_obs007_incremental_telemetry ar_obs007_p01.json
      - name: Preserve bounded result even when experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-obs007-p01-incremental-telemetry
          path: ar_obs007_p01.json
          retention-days: 30
          if-no-files-found: warn
