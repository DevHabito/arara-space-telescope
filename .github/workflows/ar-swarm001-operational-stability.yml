name: AR-SWARM001 operational stability forecast

on:
  push:
    branches:
      - research/ar-swarm001-operational-stability-20261123
  pull_request:
    paths:
      - 'docs/preregistration/AR-SWARM001-P01.md'
      - 'scripts/ar_swarm001_operational_stability.py'
      - 'tests/test_ar_swarm001_operational_stability.py'
      - '.github/workflows/ar-swarm001-operational-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install frozen numerical dependency
        run: python -m pip install 'numpy>=2,<3'
      - name: Verify independent synthetic checks
        run: python -m unittest discover -s tests -p 'test_ar_swarm001_operational_stability.py' -v
      - name: Execute the preregistered future-failure benchmark
        run: python -m scripts.ar_swarm001_operational_stability ar_swarm001_p01.json
      - name: Preserve compact evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-swarm001-operational-stability
          path: ar_swarm001_p01.json
          retention-days: 30
          if-no-files-found: warn
