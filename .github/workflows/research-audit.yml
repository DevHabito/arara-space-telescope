name: research-audit
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_recovery.py
      - run: python scripts/verify_manifest.py

  lean-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
